<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202a30">
  <meta name="description" content="Điều khiển chó H’Mông cộc trong sân 3D ở góc nhìn thứ nhất hoặc thứ ba.">
  <title>Pawtown · H’Mông cộc</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.min.js","three/addons/":"/vendor/addons/"}}</script>
  <script type="module" src="/main.mjs"></script>
</head>
<body data-mode="intro" data-view="first">
  <canvas id="world" tabindex="0" aria-label="Sân chơi 3D. WASD di chuyển, Space nhảy, V đổi góc nhìn."></canvas>

  <header class="topbar">
    <div class="brand"><img src="/favicon.svg" alt="" width="30" height="30"> Pawtown</div>
    <a class="credits" href="/licenses/index.html" target="_blank" rel="noopener">Nguồn tài nguyên <span aria-hidden="true">↗</span></a>
  </header>

  <main id="intro" class="intro">
    <div class="intro-panel">
      <p class="intro-label">SÂN TỰ DO</p>
      <h1>H’Mông <em>cộc</em></h1>
      <p class="intro-description">Chạy, nhảy và nhìn quanh từ tầm mắt của chó.</p>
      <button id="start" class="primary" disabled><span id="start-label">Đang tải…</span><span aria-hidden="true">↗</span></button>
    </div>
    <div class="intro-controls desktop-only">
      <span><kbd>WASD</kbd> Di chuyển</span><span><kbd>Shift</kbd> Chạy</span><span><kbd>Space</kbd> Nhảy</span><span><kbd>V</kbd> Đổi góc nhìn</span>
    </div>
  </main>

  <div id="hud" class="hud" hidden>
    <div class="hud-top">
      <div class="hud-name"><span aria-hidden="true"></span> H’Mông cộc</div>
      <div class="hud-actions">
        <button id="view" aria-label="Chuyển sang góc nhìn thứ ba"><span id="view-label">Góc nhìn thứ nhất</span><kbd class="desktop-only">V</kbd></button>
        <button id="pause" aria-label="Tạm dừng"><span class="pause-icon" aria-hidden="true"></span></button>
      </div>
    </div>
    <div class="reticle" aria-hidden="true"></div>
    <div class="hud-bottom">
      <div class="desktop-only hud-hints"><span id="look-hint">Kéo chuột để nhìn</span><span><kbd>R</kbd> Về điểm đầu</span><span class="third-only"><kbd>B</kbd> Sủa</span></div>
      <div id="stamina" class="stamina" role="progressbar" aria-label="Sức chạy" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
        <span>SỨC CHẠY</span><div class="stamina-track"><i id="stamina-fill"></i></div>
      </div>
    </div>
    <div class="touch-only touch-controls">
      <div id="joystick" class="joystick" aria-label="Cần điều khiển di chuyển"><div id="stick-knob"></div></div>
      <div class="touch-actions">
        <button id="bark" class="third-only">Sủa</button>
        <button id="sprint" aria-label="Giữ để chạy">Chạy</button>
        <button id="jump">Nhảy</button>
      </div>
    </div>
  </div>

  <section id="pause-screen" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="dialog">
      <h2 id="pause-title">Tạm dừng</h2>
      <button id="resume" class="primary"><span>Tiếp tục</span><span aria-hidden="true">↗</span></button>
      <button id="reset" class="secondary">Về điểm đầu</button>
    </div>
  </section>

  <section id="fatal" class="overlay" role="alert" hidden>
    <div class="dialog">
      <h2>Chưa thể vào sân</h2>
      <p id="fatal-message"></p>
      <button id="reload" class="primary">Tải lại</button>
    </div>
  </section>
  <noscript>Bật JavaScript để vào sân chơi Pawtown.</noscript>
</body>
</html>
